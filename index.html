<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebForge | Premium Website Marketplace</title>
    
    <!-- Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['Space Mono', 'monospace']
                    },
                    colors: { background: '#0a0a0a', glass: 'rgba(255, 255, 255, 0.03)' },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 15s linear infinite',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-15px)' } },
                        'pulse-glow': { '0%, 100%': { opacity: 1, filter: 'brightness(1)' }, '50%': { opacity: .7, filter: 'brightness(1.5)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0a0a0a; color: #ffffff; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .glass-panel:hover { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 8px 32px rgba(59, 130, 246, 0.15); }
        .neon-text { text-shadow: 0 0 10px rgba(59,130,246,0.5), 0 0 20px rgba(59,130,246,0.3); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .gradient-text { background: linear-gradient(to right, #60a5fa, #a855f7, #ec4899); -webkit-background-clip: text; color: transparent; }
        
        /* Hacker Scanline Effect */
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
        }
    </style>

    <!-- React, Babel, Framer Motion, Firebase -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

            "Uttarakhand": ["Dehradun", "Haridwar", "Roorkee"],
            "West Bengal": ["Kolkata", "Howrah", "Darjeeling", "Siliguri"],
            "Other": ["Other District"]
        };

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDkF2K56NPSTp34tmOf7MgqdMnPLqz2C2g",
            authDomain: "nova-11-d1696.firebaseapp.com",
            databaseURL: "https://nova-11-d1696-default-rtdb.firebaseio.com",
            projectId: "nova-11-d1696",
            storageBucket: "nova-11-d1696.firebasestorage.app",
            messagingSenderId: "321625355066",
            appId: "1:321625355066:web:65bb1212db3286aa815603"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ADMIN_EMAIL = 'thepremanshu@gmail.com';
        const CATEGORIES = ['Business', 'Portfolio', 'E-commerce', 'SaaS'];

        // --- PREMIUM HACKER LOADING COMPONENT ---
        function PremiumLoading() {
            const [logs, setLogs] = useState([]);
            const fullLogs = [
                "INITIALIZING WEBFORGE CORE ENGINE v2.0...",
                "MOUNTING PREMIUM UI COMPONENTS...",
                "ESTABLISHING SECURE UPLINK...",
                "COMPILING TAILWIND STYLESHEETS...",
                "OPTIMIZING RENDER PERFORMANCE...",
                "SYSTEM BOOT SUCCESSFUL. READY."
            ];

            useEffect(() => {
                let i = 0;
                const interval = setInterval(() => {
                    if (i < fullLogs.length) {
                        setLogs(prev => [...prev, fullLogs[i]]);
                        i++;
                    }
                }, 400); 
                return () => clearInterval(interval);
            }, []);

            return (
                <motion.div 
                    initial={{ opacity: 1 }} 
                    exit={{ opacity: 0, scale: 1.05, filter: "blur(10px)" }} 
                    transition={{ duration: 0.8, ease: "easeInOut" }} 
                    className="fixed inset-0 z-[9999] bg-[#0a0a0a] flex flex-col font-mono text-gray-300 overflow-hidden"
                >
                    <div className="absolute top-[10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-blue-600/10 blur-[150px] pointer-events-none animate-float z-0"></div>
                    <div className="absolute bottom-[10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-purple-600/10 blur-[150px] pointer-events-none animate-float-delayed z-0"></div>
                    <div className="absolute inset-0 pointer-events-none opacity-30 bg-[linear-gradient(to_bottom,rgba(255,255,255,0)_50%,rgba(0,0,0,0.2)_50%)] bg-[length:100%_4px] z-0"></div>
                    
                    <div className="flex-grow p-6 md:p-10 flex flex-col justify-end max-w-4xl w-full relative z-10 mx-auto">
                        <div className="mb-8">
                            <pre className="text-[6px] md:text-[10px] leading-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-8 hidden md:block drop-shadow-[0_0_15px_rgba(59,130,246,0.3)]">
{`
 __        __   _     _____                    
 \\ \\      / /__| |__ |  ___|__  _ __ __ _  ___ 
  \\ \\ /\\ / / _ \\ '_ \\| |_ / _ \\| '__/ _\` |/ _ \\
   \\ V  V /  __/ |_) |  _| (_) | | | (_| |  __/
    \\_/\\_/ \\___|_.__/|_|  \\___/|_|  \\__, |\\___|
                                    |___/      
`}
                            </pre>
                            {logs.map((log, index) => (
                                <motion.div initial={{ opacity: 0, x: -10 }} animate={{ opacity: 1, x: 0 }} key={index} className="mb-2 text-xs md:text-sm drop-shadow-md">
                                    <span className="opacity-40">[{new Date().toISOString().split('T')[1].slice(0,-1)}]</span> 
                                    <span className="text-blue-500 font-bold ml-2">{">"}</span> 
                                    <span className="font-semibold ml-2 text-gray-200">{log}</span>
                                </motion.div>
                            ))}
                            <div className="mt-2 text-xs md:text-sm animate-pulse">
                                <span className="opacity-40">[{new Date().toISOString().split('T')[1].slice(0,-1)}]</span> 
                                <span className="text-purple-500 font-bold ml-2">{">"}</span> 
                                <span className="font-bold ml-2 text-white">_</span>
                            </div>
                        </div>
                        
                        <div className="w-full border border-white/10 p-1 rounded-full mt-4 bg-black/50 shadow-[0_0_20px_rgba(59,130,246,0.1)] backdrop-blur-md">
                            <motion.div 
                                initial={{ width: "0%" }} 
                                animate={{ width: "100%" }} 
                                transition={{ duration: 3.2, ease: "easeInOut" }} 
                                className="h-2 md:h-3 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 shadow-[0_0_15px_rgba(168,85,247,0.6)]"
                            />
                        </div>
                    </div>

                    <div className="py-6 text-center text-[10px] md:text-xs tracking-[0.4em] font-bold opacity-70 z-10 bg-transparent">
                        DEVELOPED BY <span className="text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]">APNA ADDA</span>
                    </div>
                </motion.div>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            
            const [isAuthLoaded, setIsAuthLoaded] = useState(false);
            const [isMinTimePassed, setIsMinTimePassed] = useState(false);
            
            const [currentView, setCurrentView] = useState('home'); 
            const [activeDemo, setActiveDemo] = useState(null);
            const [activeOrder, setActiveOrder] = useState(null);
            const [showAuth, setShowAuth] = useState(false);
            
            const [toast, setToast] = useState(null); 
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [orderWizardDemo, setOrderWizardDemo] = useState(null);
            
            const [savedScroll, setSavedScroll] = useState(0);

            useEffect(() => {
                setTimeout(() => setIsMinTimePassed(true), 3500); 
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const askConfirm = (title, message, onConfirm, type = 'danger') => {
                setConfirmDialog({ title, message, onConfirm, type });
            };

            const navigateTo = (view, preserveScroll = false) => {
                setCurrentView(view);
                if (!preserveScroll) {
                    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 10);
                }
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        const isAdm = u.email === ADMIN_EMAIL;
                        setIsAdmin(isAdm);
                        if (isAdm && currentView === 'home' && !isAuthLoaded) setCurrentView('admin');
                    } else {
                        setUser(null); setIsAdmin(false);
                        if(['admin', 'chat', 'myorders'].includes(currentView)) setCurrentView('home');
                    }
                    setIsAuthLoaded(true);
                });
                return unsubscribe;
            }, []); 

            useEffect(() => {
                setTimeout(async () => {
                    const snap = await db.collection('demos').limit(1).get();
                    if (snap.empty) {
                        const batch = db.batch(); let count = 1;
                        CATEGORIES.forEach((cat, idx) => {
                            for(let i=0; i<10; i++) {
                                const ref = db.collection('demos').doc();
                                batch.set(ref, {
                                    demoNumber: count, title: `${cat} Premium Model ${i+1}`, category: cat,
                                    description: `Premium highly-converting ${cat.toLowerCase()} layout featuring modern UI paradigms.`,
                                    price: 1999 + Math.floor(Math.random() * 3000)
                                });
                                count++;
                            }
                        });
                        await batch.commit();
                    }
                }, 1000);
            }, []);

            const loading = !(isAuthLoaded && isMinTimePassed);

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden bg-background">
                    <AnimatePresence mode="wait">
                        {loading ? (
                            <PremiumLoading key="loader" />
                        ) : (
                            <motion.div key="app" initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 0.5 }} className="w-full flex flex-col min-h-screen relative">
                                
                                <div className="fixed top-[10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-blue-600/10 blur-[150px] pointer-events-none z-0 animate-float"></div>
                                <div className="fixed bottom-[10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-purple-600/10 blur-[150px] pointer-events-none z-0 animate-float-delayed"></div>

                                <Navbar user={user} isAdmin={isAdmin} currentView={currentView} setCurrentView={navigateTo} setShowAuth={setShowAuth} askConfirm={askConfirm} showToast={showToast} />

                                <main className="flex-grow pt-24 px-4 md:px-6 max-w-7xl mx-auto w-full relative z-10 pb-28 md:pb-12">
                                    <AnimatePresence mode="wait">
                                        {currentView === 'home' && <Home key="home" setCurrentView={navigateTo} user={user} setShowAuth={setShowAuth} />}
                                        {currentView === 'demos' && <Demos key="demos" categories={CATEGORIES} setCurrentView={navigateTo} setActiveDemo={setActiveDemo} user={user} setShowAuth={setShowAuth} db={db} setOrderWizardDemo={setOrderWizardDemo} savedScroll={savedScroll} setSavedScroll={setSavedScroll} />}
                                        {currentView === 'preview' && <DemoPreview key="preview" demo={activeDemo} setCurrentView={navigateTo} setOrderWizardDemo={setOrderWizardDemo} user={user} setShowAuth={setShowAuth} />}
                                        {currentView === 'custom' && <CustomOrder key="custom" user={user} db={db} setCurrentView={navigateTo} showToast={showToast} />}
                                        {currentView === 'myorders' && <MyOrders key="myorders" user={user} db={db} setCurrentView={navigateTo} askConfirm={askConfirm} showToast={showToast} />}
                                        {currentView === 'chat' && <AdminChat key="chat" order={activeOrder} user={user} isAdmin={isAdmin} db={db} setCurrentView={navigateTo} showToast={showToast} />}
                                        {currentView === 'admin' && isAdmin && <AdminPanel key="admin" db={db} setCurrentView={navigateTo} setActiveOrder={setActiveOrder} showToast={showToast} askConfirm={askConfirm} />}
                                    </AnimatePresence>
                                </main>

                                {currentView !== 'preview' && <Footer />}
                                
                                <MobileBottomNav user={user} isAdmin={isAdmin} currentView={currentView} setCurrentView={navigateTo} />

                                {showAuth && <AuthModal setShowAuth={setShowAuth} showToast={showToast} />}
                                {orderWizardDemo && <DemoOrderWizard demo={orderWizardDemo} user={user} db={db} onClose={() => setOrderWizardDemo(null)} setCurrentView={navigateTo} showToast={showToast} />}
                                {confirmDialog && <CustomConfirm dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />}

                                <AnimatePresence>
                                    {toast && (
                                        <motion.div initial={{ y: 50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 50, opacity: 0 }} className="fixed bottom-24 md:bottom-10 right-0 left-0 md:left-auto md:right-10 z-[999] px-4 md:px-0 flex justify-center">
                                            <div className={`px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 font-semibold text-white ${toast.type === 'error' ? 'bg-red-600/95 border-red-500' : 'bg-green-600/95 border-green-500'} backdrop-blur-xl border shadow-[0_10px_40px_rgba(0,0,0,0.5)]`}>
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'} shadow-inner`}>
                                                    {toast.type === 'success' ? '✓' : '✕'}
                                                </div>
                                                {toast.message}
                                            </div>
                                        </motion.div>
                                    )}
                                </AnimatePresence>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        // --- COMPONENTS ---

        function AnimatedCodeLogo() {
            return (
                <div className="relative w-9 h-9 flex items-center justify-center bg-gradient-to-br from-blue-900/40 to-purple-900/40 rounded-xl border border-blue-500/30 overflow-hidden shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                    <motion.div animate={{ rotate: 360 }} transition={{ duration: 8, repeat: Infinity, ease: "linear" }} className="absolute inset-0 bg-gradient-to-tr from-blue-500/20 to-purple-600/20" />
                    <svg className="w-5 h-5 text-blue-300 relative z-10" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                        <motion.path initial={{ pathLength: 0 }} animate={{ pathLength: 1 }} transition={{ duration: 2, repeat: Infinity, repeatType: "reverse", ease: "easeInOut" }} strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                </div>
            );
        }

        function Navbar({ user, isAdmin, currentView, setCurrentView, setShowAuth, askConfirm, showToast }) {
            const [showProfile, setShowProfile] = useState(false);

            const navItems = [
                { id: 'home', label: 'Home' },
                { id: 'demos', label: 'Marketplace' },
                ...(user && !isAdmin ? [{ id: 'custom', label: 'Custom Build' }] : []),
                ...(user ? [{ id: 'myorders', label: 'My Orders' }] : []),
                ...(isAdmin ? [{ id: 'admin', label: 'Admin Panel' }] : [])
            ];

            const handleLogout = () => {
                setShowProfile(false);
                askConfirm("Secure Logout", "Are you sure you want to log out of your WebForge account?", async () => {
                    await auth.signOut();
                    showToast("Logged out successfully.", "success");
                    setCurrentView('home');
                }, "danger");
            };

            return (
                <nav className="fixed top-0 w-full z-50 glass-panel border-b border-white/10 rounded-none bg-background/80 backdrop-blur-xl">
                    <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                        <div className="text-xl md:text-2xl font-bold tracking-tighter cursor-pointer flex items-center gap-3" onClick={() => setCurrentView('home')}>
                            <AnimatedCodeLogo />
                            {/* Ensured WebForge displays on mobile too */}
                            <span className="text-white neon-text">WebForge</span>
                        </div>
                        
                        <div className="hidden md:flex gap-6 text-sm font-medium text-gray-400 relative">
                            {navItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setCurrentView(item.id)} 
                                    className={`relative px-3 py-2 transition-colors duration-300 ${currentView === item.id ? 'text-white' : 'hover:text-gray-200'}`}
                                >
                                    {item.label}
                                    {currentView === item.id && (
                                        <motion.div 
                                            layoutId="nav-underline" 
                                            className="absolute left-0 bottom-0 w-full h-[3px] bg-gradient-to-r from-blue-500 to-purple-500 rounded-t-full shadow-[0_0_10px_rgba(59,130,246,0.5)]" 
                                            transition={{ type: "spring", stiffness: 300, damping: 30 }}
                                        />
                                    )}
                                </button>
                            ))}
                        </div>

                        <div>
                            {user ? (
                                <div className="relative">
                                    <button onClick={() => setShowProfile(!showProfile)} className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(168,85,247,0.4)] border-2 border-white/20 hover:scale-105 transition transform z-50">
                                        {user.displayName ? user.displayName[0].toUpperCase() : user.email[0].toUpperCase()}
                                    </button>
                                    
                                    <AnimatePresence>
                                        {showProfile && (
                                            <>
                                                <div className="fixed inset-0 z-40" onClick={() => setShowProfile(false)}></div>
                                                <motion.div initial={{opacity:0, y:10, scale:0.95}} animate={{opacity:1, y:0, scale:1}} exit={{opacity:0, scale:0.95}} className="absolute right-0 mt-3 w-56 glass-panel bg-black/95 border border-white/10 rounded-2xl p-2 flex flex-col z-50 shadow-2xl">
                                                    <div className="px-4 py-3 border-b border-white/10 mb-2 text-center">
                                                        <div className="w-12 h-12 mx-auto rounded-full bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center font-black text-white shadow-lg mb-2 text-lg">
                                                            {user.displayName ? user.displayName[0].toUpperCase() : user.email[0].toUpperCase()}
                                                        </div>
                                                        <div className="text-sm font-bold text-white truncate">{user.displayName || 'User'}</div>
                                                        <div className="text-xs text-gray-400 truncate">{user.email}</div>
                                                    </div>
                                                    <button onClick={handleLogout} className="w-full text-left px-4 py-2.5 text-sm text-red-400 font-bold hover:bg-red-500/10 rounded-xl transition flex items-center gap-3">
                                                        <span>🚪</span> Secure Logout
                                                    </button>
                                                </motion.div>
                                            </>
                                        )}
                                    </AnimatePresence>
                                </div>
                            ) : (
                                <button onClick={() => setShowAuth(true)} className="px-6 py-2 rounded-full bg-white text-black font-bold hover:bg-gray-200 transition shadow-[0_0_20px_rgba(255,255,255,0.4)]">Login</button>
                            )}
                        </div>
                    </div>
                </nav>
            );
        }

        function MiniChat({ order, user, db }) {
            const [messages, setMessages] = useState([]);
            const [msgText, setMsgText] = useState('');
            const msgsEndRef = useRef(null);

            useEffect(() => {
                const unsub = db.collection('messages').where('orderId', '==', order.id).onSnapshot(snap => {
                    let docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    docs.sort((a,b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
                    setMessages(docs);
                    setTimeout(() => msgsEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
                });
                return unsub;
            }, [order.id]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if(!msgText.trim()) return;
                const txt = msgText; setMsgText('');
                
                await db.collection('messages').add({ orderId: order.id, senderId: user.uid, text: txt, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection('orders').doc(order.id).update({ lastMessage: `User: ${txt}`, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp() });

                if (!order.hasUserReplied) {
                    await db.collection('orders').doc(order.id).update({ hasUserReplied: true });
                    setTimeout(async () => {
                        await db.collection('messages').add({ orderId: order.id, senderId: 'admin', text: "Thanks for messaging! An engineer will reply here shortly.", timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                        await db.collection('orders').doc(order.id).update({ lastMessage: "System: Engineer will reply soon.", lastMessageTime: firebase.firestore.FieldValue.serverTimestamp() });
                    }, 1500);
                }
            };

            return (
                <div className="flex flex-col h-[450px] bg-[#111] border border-white/10 rounded-2xl overflow-hidden mt-6 shadow-xl">
                    <div className="p-4 bg-white/5 border-b border-white/10 flex justify-between items-center">
                        <span className="font-bold text-white flex items-center gap-2">💬 Project Discussion</span>

                    </div>
                    <div className="flex-grow overflow-y-auto p-5 space-y-5 flex flex-col hide-scrollbar">
                        {messages.map(m => {
                            const isSystem = m.text.startsWith('System:');
                            const isMe = m.senderId === user.uid;

                            if (isSystem) {
                                return <div key={m.id} className="w-full text-center text-[10px] text-gray-500 font-mono py-1">{m.text}</div>;
                            }

                            return (
                                <div key={m.id} className={`flex flex-col w-full ${isMe ? 'items-end' : 'items-start'}`}>
                                    <span className="text-[10px] text-gray-400 mb-1 px-1 font-bold uppercase">{isMe ? 'You' : 'WebForge Support'}</span>
                                    <div className={`px-4 py-3 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow-lg ${isMe ? 'bg-blue-600 text-white rounded-tr-sm' : 'bg-[#222] text-gray-100 rounded-tl-sm border border-white/5'}`}>

        // --- MY ORDERS DASHBOARD ---
        function MyOrders({ user, db, setCurrentView, askConfirm, showToast }) {
            const [orders, setOrders] = useState([]);
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [tab, setTab] = useState('Templates');

            useEffect(() => {
                if(!user) return;
                const unsub = db.collection('orders').where('userId', '==', user.uid).onSnapshot(snap => {
                    let fetched = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    fetched.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setOrders(fetched);
                    
                    if(selectedOrder) {
                        const updated = fetched.find(d => d.id === selectedOrder.id);

                    }
                });
                return unsub;
            }, [user]);

            const getStatusColor = (status) => {
                const map = { 'Pending': 'text-yellow-400', 'Approved': 'text-green-400', 'Rejected': 'text-red-400', 'Cancelled': 'text-red-500', 'Discussing': 'text-blue-400', 'In Progress': 'text-purple-400', 'Completed': 'text-teal-400' };
                return map[status] || 'text-gray-400';
            };

            const handleCancelOrder = async (orderId) => {
                try {
                    await db.collection('orders').doc(orderId).update({ status: 'Cancelled', lastMessage: 'System: Order Cancelled by User' });

            const renderTimeline = (status) => {

                const stages = ['Pending', 'Approved', 'In Progress', 'Completed'];
                let currIdx = stages.indexOf(status);

                return (

                                </div>
                                <span className={`absolute top-10 md:top-12 text-[8px] md:text-[10px] font-black uppercase tracking-wider whitespace-nowrap ${idx <= currIdx ? 'text-blue-400' : 'text-gray-600'}`}>{stage}</span>

            if (selectedOrder) {
                return (

                        <div className="flex flex-row justify-between items-center mb-8 gap-4 border-b border-white/10 pb-6">
                            <button onClick={() => setSelectedOrder(null)} className="flex items-center justify-center gap-2 px-4 py-2 md:px-5 md:py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition text-xs md:text-sm font-bold text-white flex-shrink-0">
                                ← <span className="hidden sm:inline">Back to List</span><span className="sm:hidden">Back</span>
                            </button>
                            
                            {['Pending', 'Discussing', 'Approved'].includes(selectedOrder.status) && (
                                <button 
                                    onClick={() => askConfirm("Cancel Order?", "Are you sure you want to cancel this order? This action cannot be undone.", () => handleCancelOrder(selectedOrder.id), 'danger')} 
                                    className="px-4 py-2 md:px-5 md:py-2.5 bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-600 hover:text-white rounded-xl text-xs md:text-sm font-black uppercase tracking-wider transition flex-shrink-0">
                                    ✕ <span className="hidden sm:inline">Cancel Order</span><span className="sm:hidden">Cancel</span>
                                </button>
                            )}
                        </div>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-[1fr_1.2fr] gap-10">
                            <div>
                                <h2 className="text-2xl md:text-3xl font-black mb-2 leading-tight">
                                    {selectedOrder.demoId === 'custom' ? `Custom Project` : `Template #${selectedOrder.demoNumber} Build`}
                                </h2>
                                <p className="text-gray-400 text-sm mb-8 font-mono">{selectedOrder.demoId === 'custom' ? selectedOrder.websiteName : 'Marketplace Order'}</p>
                                
                                <div className="bg-[#111] p-6 md:p-8 rounded-2xl border border-white/5 mb-6 shadow-inner">
                                    <div className="flex justify-between items-end mb-8 border-b border-white/5 pb-6">
                                        <div><p className="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1">Order Status</p><p className={`text-2xl md:text-3xl font-black ${getStatusColor(selectedOrder.status)}`}>{selectedOrder.status}</p></div>
                                        <div className="text-right"><p className="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1">Agreed Price</p><p className="text-2xl md:text-3xl font-black text-white">{selectedOrder.price === 'TBD' ? 'TBD' : `₹${selectedOrder.price}`}</p></div>
                                    </div>
                                    <div className="pb-8">{renderTimeline(selectedOrder.status)}</div>
                                </div>
                                
                                <div className="bg-[#111] p-6 rounded-2xl border border-white/5 text-sm space-y-4 text-gray-300 shadow-inner">
                                    <h4 className="font-black text-white border-b border-white/10 pb-3 mb-3 uppercase tracking-widest text-xs">Project Specifications</h4>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><strong className="text-gray-500 block text-[10px] uppercase mb-1">State/UT</strong> <span className="font-semibold text-xs md:text-sm">{selectedOrder.state}</span></div>
                                        <div><strong className="text-gray-500 block text-[10px] uppercase mb-1">Type</strong> <span className="font-semibold text-xs md:text-sm">{selectedOrder.orderType === 'exact' ? 'Exact Match' : 'Customizations Required'}</span></div>
                                    </div>
                                    <div><strong className="text-gray-500 block text-[10px] uppercase mb-2">Requirements Note</strong> <div className="bg-black/50 p-3 rounded-lg border border-white/5 font-mono text-xs overflow-hidden break-words">{selectedOrder.specialMessage}</div></div>
                                </div>
                            </div>
                            
                            <div className="flex flex-col h-full mt-6 lg:mt-0">
                                <h3 className="text-xl font-black mb-2">Engineering Chat</h3>
                                <p className="text-sm text-gray-400 mb-2">Direct line to the developer assigned to your build.</p>
                                <MiniChat order={selectedOrder} user={user} db={db} />
                            </div>
                        </div>
                    </motion.div>
                );
            }

            const visibleOrders = orders.filter(o => tab === 'Templates' ? o.demoId !== 'custom' : o.demoId === 'custom');

            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="mt-6 md:mt-10">
                    <h2 className="text-3xl md:text-5xl font-black mb-8">My Orders Dashboard</h2>
                    
                    <div className="flex gap-4 mb-10 border-b border-white/10 pb-4 overflow-x-auto hide-scrollbar">
                        {['Templates', 'Custom'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`px-6 md:px-8 py-3 rounded-xl font-black text-xs md:text-sm uppercase tracking-widest transition-all whitespace-nowrap ${tab === t ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(59,130,246,0.4)] transform md:scale-105' : 'bg-white/5 text-gray-500 hover:text-white hover:bg-white/10'}`}>
                                {t} Orders
                            </button>
                        ))}
                    </div>

                    {visibleOrders.length === 0 ? (
                        <div className="text-center py-24 md:py-32 bg-[#111] border border-white/5 rounded-3xl shadow-inner">

                            <div className="text-gray-400 font-bold text-lg mb-2">No {tab.toLowerCase()} orders found.</div>
                            <button onClick={()=>setCurrentView(tab === 'Templates' ? 'demos' : 'custom')} className="text-blue-400 font-bold hover:underline">Start a new project →</button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                            {visibleOrders.map(o => (
                                <div key={o.id} onClick={() => setSelectedOrder(o)} className="glass-panel p-6 rounded-3xl cursor-pointer hover:-translate-y-2 transition-all duration-300 group border border-white/10 hover:border-blue-500/30 hover:shadow-[0_10px_40px_rgba(59,130,246,0.15)] flex flex-col h-[280px]">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <span className="text-[10px] text-gray-500 font-black uppercase tracking-widest mb-1 block">Order ID: {o.id.substring(0,6)}</span>

                                        </div>
                                        <span className={`text-[10px] uppercase font-black px-2.5 py-1.5 rounded border ${o.status==='Cancelled'?'bg-red-500/10 text-red-500 border-red-500/20' : o.status==='Completed'?'bg-teal-500/10 text-teal-400 border-teal-500/20' : o.status==='Pending'?'bg-yellow-500/10 text-yellow-400 border-yellow-500/20' : 'bg-blue-500/10 text-blue-400 border-blue-500/20'}`}>{o.status}</span>

                                        <div className="mb-2 line-clamp-2 leading-relaxed opacity-70 break-words">{o.specialMessage}</div>
                                    </div>
                                    <div className="bg-[#111] p-3 rounded-xl border border-white/5 mb-4 text-xs font-mono text-gray-400 truncate flex items-center gap-2">
                                        <span className="text-blue-400 text-[10px]">💬</span> {o.lastMessage}
                                    </div>
                                    <div className="flex justify-between items-center border-t border-white/10 pt-4 mt-auto">
                                        <span className="font-black text-lg text-white">{o.price === 'TBD' ? 'TBD' : `₹${o.price}`}</span>
                                        <span className="text-blue-400 text-xs md:text-sm font-bold group-hover:underline">Open Dashboard →</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </motion.div>
            );
        }

        // --- FULL ADMIN CHAT SYSTEM ---
        function AdminChat({ user, isAdmin, db, setCurrentView, order, showToast }) {
            const [selectedOrder, setSelectedOrder] = useState(order);
            const [messages, setMessages] = useState([]);
            const [msgText, setMsgText] = useState('');
            const msgsEndRef = useRef(null);

            useEffect(() => { if (order) setSelectedOrder(order); }, [order]);

            useEffect(() => {
                if(!selectedOrder) return;
                const unsub = db.collection('messages').where('orderId', '==', selectedOrder.id).onSnapshot(snap => {
                    let docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    docs.sort((a,b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
                    setMessages(docs);
                    setTimeout(() => msgsEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
                });
                return unsub;
            }, [selectedOrder]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if(!msgText.trim() || !selectedOrder) return;
                const txt = msgText; setMsgText('');
                
                await db.collection('messages').add({ orderId: selectedOrder.id, senderId: user.uid, text: txt, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection('orders').doc(selectedOrder.id).update({ lastMessage: `Admin: ${txt}`, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp() });
            };

            if (!selectedOrder) return <div className="text-center mt-20 text-gray-400 font-bold">No order selected for chat. Return to Admin Panel.</div>;

            return (
                <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="flex h-[85vh] md:h-[80vh] gap-6 mt-4 max-w-5xl mx-auto">
                    <div className="flex-grow glass-panel rounded-3xl flex flex-col overflow-hidden relative shadow-[0_0_50px_rgba(0,0,0,0.5)] border-white/10">
                        <div className="p-4 md:p-6 border-b border-white/10 bg-[#111] flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setCurrentView('admin')} className="text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-bold transition">← Back</button>
                                <div>
                                    <h3 className="font-black text-lg md:text-xl text-white">Client: {selectedOrder.username}</h3>
                                    <p className="text-[10px] md:text-xs text-purple-400 font-mono mt-1 font-bold">Ref: {selectedOrder.id} • {selectedOrder.demoId === 'custom' ? 'Custom Build' : `Demo #${selectedOrder.demoNumber}`}</p>
                                </div>
                            </div>
                            <div className="text-left md:text-right">
                                <div className="text-[10px] md:text-xs text-gray-500 font-bold uppercase tracking-widest mb-1">Agreed Value</div>
                                <div className="text-xl md:text-2xl font-black text-white">{selectedOrder.price === 'TBD' ? 'TBD' : `₹${selectedOrder.price}`}</div>
                            </div>
                        </div>
                        <div className="flex-grow overflow-y-auto p-4 md:p-6 space-y-6 flex flex-col bg-[#0a0a0a] hide-scrollbar">
                            {messages.map(m => {
                                const isSystem = m.text.startsWith('System:');
                                const isMe = m.senderId !== selectedOrder.userId; 

                                if (isSystem) {
                                    return <div key={m.id} className="w-full text-center text-[10px] text-gray-500 font-mono py-1">{m.text}</div>;
                                }

                                return (
                                    <div key={m.id} className={`flex flex-col w-full ${isMe ? 'items-end' : 'items-start'}`}>
                                        <span className="text-[10px] text-gray-400 mb-1 px-1 font-bold uppercase">{isMe ? 'You (Admin)' : `Client (${selectedOrder.username})`}</span>
                                        <div className={`px-4 py-3 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow-lg ${isMe ? 'bg-purple-600 text-white rounded-tr-sm' : 'bg-[#222] text-gray-100 rounded-tl-sm border border-white/5'}`}>
                                            {m.text}
                                        </div>
                                        <span className="text-[10px] text-gray-600 mt-1 px-1 font-mono">{m.timestamp?.toDate() ? m.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}</span>
                                    </div>
                                )
                            })}
                            <div ref={msgsEndRef}></div>
                        </div>
                        <form onSubmit={sendMessage} className="p-3 md:p-4 border-t border-white/10 bg-[#111] flex gap-2 md:gap-3">
                            <input type="text" value={msgText} onChange={(e) => setMsgText(e.target.value)} placeholder="Type message to client..." className="flex-grow bg-black border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500 transition text-sm text-white font-medium placeholder-gray-600" />
                            <button type="submit" disabled={!msgText.trim()} className={`w-12 md:w-14 rounded-xl flex-shrink-0 flex items-center justify-center transition shadow-lg ${msgText.trim() ? 'bg-purple-600 hover:bg-purple-500 cursor-pointer' : 'bg-gray-800 opacity-50 cursor-not-allowed'}`}>➤</button>
                        </form>
                    </div>
                </motion.div>
            );
        }

            const [demos, setDemos] = useState([]);

                const unsub = db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snap => setOrders(snap.docs.map(d => ({ id: d.id, ...d.data() }))));

                                            {o.status === 'Cancelled' && (

                                                    <span className="animate-pulse">🚨</span> USER CANCELLED THIS ORDER <span className="animate-pulse">🚨</span>
                                                </div>
                                            )}

                                            <div className="flex flex-wrap items-center gap-2 md:gap-3 mb-3">

                                                <span><strong className="text-gray-500 uppercase tracking-widest block mb-1">Requirement / Note</strong> {o.specialMessage || 'None'}</span>
                                            </div>
                                            <p className={`text-xs md:text-sm border-l-4 pl-3 md:pl-4 py-1 italic font-mono w-full md:w-fit pr-4 rounded-r-lg truncate max-w-xl text-ellipsis ${o.status === 'Cancelled' ? 'border-red-500 text-red-400 bg-red-900/20' : 'border-purple-500 text-gray-400 bg-[#111]'}`}>« {o.lastMessage || '...'} »</p>
                                        </div>
                                        
                                        <div className="flex flex-col sm:flex-row flex-wrap items-start sm:items-end gap-3 w-full lg:w-auto pt-4 lg:pt-0 border-t lg:border-none border-white/10">
                                            {o.status === 'Pending' && (
                                                <div className="flex gap-2 w-full sm:w-auto">
                                                    <button onClick={() => updateStatus(o.id, 'Approved')} className="flex-1 sm:flex-none px-4 py-3 bg-green-600 hover:bg-green-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-[0_0_10px_rgba(34,197,94,0.4)] transition">Approve</button>
                                                    <button onClick={() => askConfirm("Reject Order?", "Are you sure you want to reject this order?", () => updateStatus(o.id, 'Rejected'), "danger")} className="flex-1 sm:flex-none px-4 py-3 bg-red-600 hover:bg-red-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-[0_0_10px_rgba(239,68,68,0.4)] transition">Reject</button>
                                                </div>
                                            )}
                                            <div className="flex flex-col gap-1 w-full sm:w-auto">
                                                <span className="text-[10px] text-gray-500 font-bold uppercase tracking-widest ml-1 hidden sm:block">Update Status</span>
                                                <select value={o.status} onChange={(e) => updateStatus(o.id, e.target.value)} className="bg-black/80 border border-white/10 rounded-xl px-4 py-3 text-xs md:text-sm font-bold text-white outline-none focus:border-purple-500 cursor-pointer w-full sm:w-40 appearance-none">
                                                    <option value="Pending">Pending</option><option value="Approved">Approved</option><option value="Rejected">Rejected</option><option value="Cancelled">Cancelled</option><option value="Discussing">Discussing</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option>
                                                </select>
                                            </div>
                                            <div className="flex gap-2 w-full sm:w-auto sm:mt-5">
                                                <button onClick={() => { setActiveOrder(o); setCurrentView('chat'); }} className="flex-1 sm:flex-none px-4 md:px-6 py-3 bg-purple-600 hover:bg-purple-500 rounded-xl text-xs md:text-sm font-black uppercase tracking-wider transition shadow-[0_0_15px_rgba(168,85,247,0.5)]">Open Chat</button>
                                                <button onClick={() => deleteOrder(o.id)} className="px-4 py-3 bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white border border-red-500/20 rounded-xl text-xs md:text-sm font-black uppercase tracking-wider transition" title="Delete Order permanently">🗑</button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {filteredOrders.length === 0 && <div className="text-center py-20 text-gray-500 font-bold text-lg md:text-xl bg-[#111] rounded-3xl border border-white/5">No {orderFilter.toLowerCase()} orders in system.</div>}
                            </div>
                        </div>
                    )}

                    {tab === 'pricing' && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                            {demos.map(d => (
                                <div key={d.id} className="glass-panel p-4 md:p-6 rounded-3xl flex flex-col border border-white/10 bg-[#111]">
                                    <div className="flex justify-between items-center mb-5">
                                        <span className="font-black text-base md:text-lg">Demo #{d.demoNumber}</span>
                                        <span className="text-[10px] font-black uppercase tracking-widest text-gray-400 bg-white/5 px-2 py-1 rounded">{d.category}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <span className="bg-black border border-white/10 rounded-xl px-4 flex items-center text-gray-400 font-bold">₹</span>
                                        <input type="number" defaultValue={d.price} onBlur={(e) => updatePrice(d.id, e.target.value)} className="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-white font-bold outline-none focus:border-purple-500 transition" />
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </motion.div>
            );
        }

        // --- AUTHENTICATION MODAL ---
        function AuthModal({ setShowAuth, showToast }) {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    if (isLogin) await auth.signInWithEmailAndPassword(email, password);
                    else {
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        await cred.user.updateProfile({ displayName: username });
                    }
                    setShowAuth(false);
                    showToast(isLogin ? "Logged in securely!" : "Account created successfully!", "success");
                } catch (err) { showToast(err.message, "error"); }
            };

            const handleGoogleAuth = async () => {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                    setShowAuth(false);
                    showToast("Logged in with Google successfully!", "success");
                } catch(err) { showToast(err.message, "error"); }
            };

            return (
                <div className="fixed inset-0 z-[600] flex items-center justify-center bg-black/80 backdrop-blur-md px-4 py-8 overflow-y-auto">
                    <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="w-full max-w-md glass-panel p-8 md:p-10 rounded-3xl border-white/20 relative shadow-[0_0_50px_rgba(0,0,0,0.8)] my-auto">
                        <button onClick={() => setShowAuth(false)} className="absolute top-6 right-6 w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white font-bold transition">✕</button>
                        <h2 className="text-3xl md:text-4xl font-black mb-8 text-center">{isLogin ? 'Welcome Back' : 'Create Account'}</h2>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            {!isLogin && (
                                <div><label className="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Username</label><input required type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full bg-[#111] border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-blue-500 transition" /></div>
                            )}
                            <div><label className="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Email</label><input required type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-[#111] border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-blue-500 transition" /></div>
                            <div><label className="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Password</label><input required type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full bg-[#111] border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-blue-500 transition" /></div>
                            <button type="submit" className="w-full py-4 mt-4 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white font-black text-lg transition shadow-[0_0_20px_rgba(59,130,246,0.4)] hover:scale-[1.02]">{isLogin ? 'Login Securely' : 'Create Account'}</button>
                        </form>
                        <div className="flex justify-between text-sm mt-5 text-gray-400 text-center w-full">
                            <span className="cursor-pointer hover:text-white font-semibold w-full" onClick={()=>setIsLogin(!isLogin)}>{isLogin ? 'Need an account? Sign up here' : 'Already have an account? Login'}</span>
                        </div>
                        <div className="flex items-center my-8"><div className="flex-grow border-t border-white/10"></div><span className="px-4 text-xs font-bold uppercase tracking-widest text-gray-500">OR</span><div className="flex-grow border-t border-white/10"></div></div>
                        <button onClick={handleGoogleAuth} className="w-full py-4 rounded-xl bg-white text-black font-black text-base hover:bg-gray-200 transition flex items-center justify-center gap-3">
                            <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google
                        </button>
                    </motion.div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
